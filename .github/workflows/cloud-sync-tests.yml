name: Cloud sync tests

on:
  push:
    branches:
      - main
      - feature/next-featur
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cloud-sync:
    name: Pull merge push metadata tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check application JavaScript
        run: node --check assets/js/app.js

      - name: Run cloud sync tests
        run: npm test
